[package]
name = "fantasian_diagnostic"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
asr = { git = "https://github.com/LiveSplit/asr", features = [
    "derive",
    "unity",
] }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
panic = "abort"
codegen-units = 1
strip = true

[profile.release.build-override]
opt-level = 0
